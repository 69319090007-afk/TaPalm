<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        TaPalm - ระบบตรวจสอบความสุกปาล์ม
    </title>

    <!-- CSS -->
    <style>
/* ========================================
   RESET
======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ========================================
   BODY
======================================== */

body {

    font-family:
        "Noto Sans Thai",
        Arial,
        sans-serif;

    background: #f3f7f4;

    color: #1f2937;

    min-height: 100vh;

}


/* ========================================
   MAIN CONTAINER
======================================== */

.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 20px;

}


/* ========================================
   HEADER
======================================== */

.header {

    background: #ffffff;

    border-radius: 20px;

    padding: 26px;

    margin-bottom: 20px;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.06);

}


/* ========================================
   BRAND
======================================== */

.brand {

    display: flex;

    align-items: center;

    gap: 16px;

}


.logo {

    width: 60px;

    height: 60px;

    border-radius: 16px;

    background: #16a34a;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 34px;

    flex-shrink: 0;

}


.brand-text h1 {

    font-size: 28px;

    line-height: 1.25;

    color: #14532d;

}


.brand-text p {

    margin-top: 5px;

    color: #6b7280;

    font-size: 16px;

}


/* ========================================
   LAST CHECK
======================================== */

.last-check {

    margin-top: 22px;

    padding-top: 18px;

    border-top: 1px solid #e5e7eb;

}


.label {

    color: #6b7280;

    font-size: 16px;

    margin-bottom: 6px;

}


.date-time {

    font-size: 20px;

    font-weight: 700;

    color: #374151;

}


/* ========================================
   READINESS CARD
======================================== */

.readiness-card {

    background: #ffffff;

    border-radius: 20px;

    padding: 35px 20px;

    text-align: center;

    margin-bottom: 20px;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.06);

}


.readiness-title {

    font-size: 21px;

    font-weight: 700;

    color: #374151;

}


.percentage {

    font-size: 84px;

    font-weight: 800;

    color: #15803d;

    margin: 15px 0 8px;

    line-height: 1;

}


/* ========================================
   STATUS
======================================== */

.status {

    display: inline-flex;

    align-items: center;

    gap: 9px;

    font-size: 24px;

    font-weight: 700;

    margin-top: 6px;

}


.status.ready {

    color: #15803d;

}


.status.not-ready {

    color: #dc2626;

}


.status-dot {

    width: 15px;

    height: 15px;

    border-radius: 50%;

    flex-shrink: 0;

}


.status.ready .status-dot {

    background: #22c55e;

}


.status.not-ready .status-dot {

    background: #ef4444;

}


/* ========================================
   PREDICTION
======================================== */

.prediction {

    margin-top: 20px;

    font-size: 18px;

    color: #6b7280;

}


.prediction strong {

    color: #374151;

    font-size: 19px;

}


/* ========================================
   SUMMARY GRID
======================================== */

.summary-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;

}


/* ========================================
   SUMMARY CARD
======================================== */

.summary-card {

    position: relative;

    background: #ffffff;

    border-radius: 20px;

    padding: 22px 14px 24px;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.06);

    border: 2px solid transparent;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


/* ========================================
   ICON BOX
   (รูปแสดงชัดเจน ไม่ใช่พื้นหลังจางๆ)
======================================== */

.icon-box {

    width: 96px;

    height: 96px;

    border-radius: 20px;

    background: #f3f7f4;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 14px;

    overflow: hidden;

    flex-shrink: 0;

}


.summary-icon {

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 8px;

}


.emoji-icon {

    font-size: 52px;

    line-height: 1;

}


/* ========================================
   SUMMARY NUMBER
======================================== */

.summary-number {

    font-size: 48px;

    font-weight: 800;

    color: #111827;

    line-height: 1.1;

}


/* ========================================
   SUMMARY HEADER
======================================== */

.summary-header {

    color: #374151;

    font-size: 19px;

    font-weight: 700;

    margin-top: 6px;

}


/* ========================================
   SUMMARY NAME
======================================== */

.summary-name {

    color: #6b7280;

    font-size: 15px;

    margin-top: 3px;

}


/* ========================================
   CARD ACCENT COLORS
======================================== */

.tree-card {

    border-color: #bbf7d0;

}


.tree-card .icon-box {

    background: #ecfdf3;

}


.all-card {

    border-color: #e5e7eb;

}


.all-card .icon-box {

    background: #f3f4f6;

}


.ripe {

    border-color: #bbf7d0;

}


.ripe .icon-box {

    background: #ecfdf3;

}


.ripe .summary-number {

    color: #16a34a;

}


.half-ripe {

    border-color: #fde68a;

}


.half-ripe .icon-box {

    background: #fffbeb;

}


.half-ripe .summary-number {

    color: #ca8a04;

}


.raw {

    border-color: #fecaca;

}


.raw .icon-box {

    background: #fef2f2;

}


.raw .summary-number {

    color: #dc2626;

}


/* ========================================
   HOVER
======================================== */

.summary-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.10);

}


/* ========================================
   TABLET
======================================== */

@media (max-width: 700px) {

    .container {

        padding: 15px;

    }


    .summary-number {

        font-size: 42px;

    }

}


/* ========================================
   MOBILE
======================================== */

@media (max-width: 600px) {

    .container {

        padding: 12px;

    }


    .header {

        padding: 20px;

        border-radius: 16px;

    }


    .brand-text h1 {

        font-size: 22px;

    }


    .percentage {

        font-size: 64px;

    }


    .status {

        font-size: 20px;

    }


    .readiness-card {

        padding: 30px 15px;

    }


    .summary-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

    }


    .summary-card {

        border-radius: 16px;

        padding: 18px 10px 20px;

    }


    .icon-box {

        width: 78px;

        height: 78px;

        margin-bottom: 10px;

    }


    .emoji-icon {

        font-size: 42px;

    }


    .summary-number {

        font-size: 36px;

    }


    .summary-header {

        font-size: 17px;

    }


    .summary-name {

        font-size: 13px;

    }

}


/* ========================================
   SMALL MOBILE
======================================== */

@media (max-width: 380px) {

    .summary-grid {

        grid-template-columns: 1fr;

    }


    .summary-card {

        padding: 20px;

    }


    .icon-box {

        width: 88px;

        height: 88px;

    }


    .summary-number {

        font-size: 40px;

    }

}

    </style>

</head>

<!-- JavaScript -->

<!-- MQTT.js: ให้ browser คุย MQTT ผ่าน WebSocket ได้ (ใช้แทนการเชื่อม MQTT แบบ TCP ตรง ๆ ซึ่ง browser ทำไม่ได้) -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
/* ========================================
   ตั้งค่าการเชื่อมต่อ MQTT
   *** แก้ 3 ค่านี้ให้ตรงกับของจริง ***
======================================== */
const MQTT_BROKER_URL = "wss://15842ed9fffd4c8aa120c4ad978b8182.s1.eu.hivemq.cloud:8884/mqtt";
const MQTT_TOPIC       = "tapalm/data";                     // topic ที่ raspberry pi publish ข้อมูลออกมา
const MQTT_OPTIONS     = {
    username: "tapalm_device",
    password: "rovann1234",
    clientId: "tapalm_web_" + Math.random().toString(16).slice(2, 8),
    reconnectPeriod: 3000
};

const lastCheckElement = document.getElementById("lastCheck");
const readinessElement = document.getElementById("readiness");
const statusElement = document.getElementById("status");
const statusTextElement = document.getElementById("statusText");
const predictionElement = document.getElementById("prediction");
const treeCountElement = document.getElementById("treeCount");
const fruitCountElement = document.getElementById("fruitCount");
const ripeCountElement = document.getElementById("ripeCount");
const halfRipeCountElement = document.getElementById("halfRipeCount");
const rawCountElement = document.getElementById("rawCount");

// วาดข้อมูลลงหน้าเว็บ - เรียกทุกครั้งที่มีข้อความใหม่เข้ามาจาก MQTT
function updateUI(palmData) {
    if (lastCheckElement) lastCheckElement.textContent = palmData.lastCheck;
    if (readinessElement) readinessElement.textContent = `${palmData.readiness}%`;
    if (treeCountElement) treeCountElement.textContent = palmData.treeCount;
    if (fruitCountElement) fruitCountElement.textContent = palmData.fruitCount;
    if (ripeCountElement) ripeCountElement.textContent = palmData.ripeCount;
    if (halfRipeCountElement) halfRipeCountElement.textContent = palmData.halfRipeCount;
    if (rawCountElement) rawCountElement.textContent = palmData.rawCount;

    if (statusElement && statusTextElement && predictionElement) {
        if (palmData.readiness >= 85) {
            statusElement.className = "status ready";
            statusTextElement.textContent = "พร้อมตัด";
            predictionElement.textContent = "พร้อมตัดแล้ว";
        } else {
            statusElement.className = "status not-ready";
            statusTextElement.textContent = "ยังตัดไม่ได้";
            predictionElement.textContent = "ประมาณ 2 สัปดาห์";
        }
    }
}

// เชื่อมต่อ MQTT broker ผ่าน WebSocket
const client = mqtt.connect(MQTT_BROKER_URL, MQTT_OPTIONS);

client.on("connect", () => {
    console.log("เชื่อมต่อ MQTT สำเร็จ");
    client.subscribe(MQTT_TOPIC, (err, granted) => {
        if (err) {
            console.error("subscribe ไม่สำเร็จ:", err);
        } else {
            console.log("subscribe สำเร็จ:", granted);
        }
    });
});

client.on("message", (topic, message) => {
    console.log("ได้รับข้อความจาก topic:", topic, "| payload:", message.toString());
    try {
        // *** สมมติว่า raspberry pi ส่ง JSON string ที่มี field ตรงกับ palmData เดิม ***
        // เช่น {"lastCheck":"...", "readiness":86.7, "treeCount":3, "fruitCount":15,
        //       "ripeCount":12, "halfRipeCount":2, "rawCount":1}
        const data = JSON.parse(message.toString());
        console.log("parse JSON สำเร็จ, กำลังอัปเดตหน้าเว็บ:", data);
        updateUI(data);
    } catch (e) {
        console.error("ข้อมูลที่ได้รับไม่ใช่ JSON ที่ถูกต้อง:", message.toString(), e);
    }
});

client.on("error", (err) => {
    console.error("MQTT error:", err);
});
</script>
